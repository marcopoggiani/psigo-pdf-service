name: PsiGo OCR security tests
on:
  push:
    branches: [main]
    paths:
      - 'image-ocr.mjs'
      - 'server.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/ocr-tests.yml'
  pull_request:
    paths:
      - 'image-ocr.mjs'
      - 'server.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/ocr-tests.yml'
jobs:
  raster-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
